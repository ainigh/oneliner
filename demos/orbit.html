/* the wave: every reading on the desk is a smooth swing plus a little noise, so the page looks alive and still looks the same twice. */
Weave.application.driftOf = (row, index) => Weave.library.control.defaultTo(0)(row.drift) * index;
Weave.application.swingOf = (row, index) => row.swing * (Math.sin(index / row.period + row.phase) + Weave.library.composition.noise(index + row.phase) - 0.5);
Weave.application.wave = (row, index) => row.base * (1 + Weave.application.driftOf(row, index) + Weave.application.swingOf(row, index));
Weave.application.readingsOver = (row, count, tick) => Weave.library.composition.range(count).map(index => Weave.application.wave(row, index + tick));
Weave.application.pace = 2600;
Weave.application.sparkDays = 14;

/* sorts: one row per column a reader can sort by. A number sorts largest first, a name from A. */
Weave.application.sorts = {};
Weave.application.sorts.name = row => row.name;
Weave.application.sorts.mrr = row => 0 - row.mrr;
Weave.application.sorts.seats = row => 0 - row.seats;
Weave.application.sortNames = Weave.library.components.nameTable(Weave.application.sorts);

/* choices: the rows the settings page offers, each keyed by the library name it applies. */
Weave.application.themeChoices = {};
Weave.application.themeChoices.system = 'System';
Weave.application.themeChoices.light = 'Light';
Weave.application.themeChoices.dark = 'Dark';
Weave.application.themeChoices.dusk = 'Dusk';
Weave.application.themeChoices.contrast = 'High contrast';
/* paletteChoices: the presets, and the indigo the library starts with. */
Weave.application.paletteChoices = {};
Weave.application.paletteChoices.indigo = 'Indigo';
Weave.application.paletteChoices.ocean = 'Ocean';
Weave.application.paletteChoices.forest = 'Forest';
Weave.application.paletteChoices.plum = 'Plum';
Weave.application.paletteChoices.ember = 'Ember';
/* densityChoices: how tightly the desk sits. */
Weave.application.densityChoices = {};
Weave.application.densityChoices.standard = 'Standard';
Weave.application.densityChoices.snug = 'Snug';
Weave.application.densityChoices.roomy = 'Roomy';
Weave.application.choiceNames = Weave.library.components.nameTable(Weave.library.composition.merge(Weave.application.themeChoices, Weave.library.composition.merge(Weave.application.paletteChoices, Weave.application.densityChoices)));

/* state: where the reader is, what is switched off, what the customer list is narrowed to, and whether the desk is live. */
Weave.application.startState = { view: Weave.application.viewNames.overview, span: Weave.application.spanNames.month, hidden: [], tick: 0, query: '', health: Weave.application.healthNames.everyone, sort: Weave.application.sortNames.mrr, live: true, digest: true, theme: Weave.application.choiceNames.system, palette: Weave.application.choiceNames.indigo, density: Weave.application.choiceNames.standard, unread: Weave.application.data.alerts.length, draft: Weave.application.workspaceStart, saved: Weave.application.workspaceStart };
Weave.application.store = Weave.library.patterns.linkTo('view')(Weave.library.patterns.store(Weave.application.startState));
Weave.application.change = made => Weave.application.store.update(() => made);
Weave.application.toasts = Weave.library.patterns.notifications({});
Weave.application.root = () => Weave.library.browser.documentElement();

/* moving about: the rail, the palette and the number keys all go through here. */
Weave.application.go = key => () => Weave.application.change({ view: key });
Weave.application.shown = (state, row) => !state.hidden.includes(row.key);
Weave.application.flipped = (hidden, key) => Weave.library.control.either(list => list.includes(key), list => list.filter(other => other !== key), list => list.concat([key]))(hidden);
Weave.application.toggleSeries = key => () => Weave.application.store.update(state => ({ hidden: Weave.application.flipped(state.hidden, key) }));
Weave.application.advance = state => Weave.library.control.either(() => state.live, () => ({ tick: state.tick + 1 }), () => ({}))(state);
Weave.application.tick = () => Weave.application.store.update(Weave.application.advance);
Weave.application.flipLive = () => (Weave.application.store.update(state => ({ live: !state.live })), Weave.application.toasts.push(Weave.application.liveWord(Weave.application.store.state), Weave.library.components.toneNames.info));
Weave.application.liveWord = state => Weave.library.control.either(() => state.live, () => Weave.application.words.liveOn, () => Weave.application.words.liveOff)(state);

/* appearance: each choice applies one library row to the document and remembers which it was. */
Weave.application.applyTheme = key => Weave.library.control.either(() => key === Weave.application.choiceNames.system, () => Weave.library.attributes.removeAttribute(Weave.library.components.themeAttribute)(Weave.application.root()), () => Weave.library.components.setTheme(key))(key);
Weave.application.chooseTheme = key => (Weave.application.applyTheme(key), Weave.application.change({ theme: key }));
Weave.application.flipTheme = () => (Weave.library.components.toggleTheme(), Weave.application.change({ theme: Weave.library.components.theme() }), Weave.application.toasts.push(Weave.application.words.themeChanged, Weave.library.components.toneNames.success));
Weave.application.clearPalette = () => Weave.library.composition.keys(Weave.library.components.presets.ocean).forEach(key => Weave.library.style.removeCss(Weave.library.components.variableName(key))(Weave.application.root()));
Weave.application.applyPalette = key => Weave.library.control.either(() => key === Weave.application.choiceNames.indigo, Weave.application.clearPalette, () => Weave.library.components.usePreset(key))(key);
Weave.application.choosePalette = key => (Weave.application.clearPalette(), Weave.application.applyPalette(key), Weave.application.change({ palette: key }));
Weave.application.applyDensity = key => Weave.library.control.either(() => key === Weave.application.choiceNames.standard, () => Weave.library.attributes.removeAttribute(Weave.library.components.densityAttribute)(Weave.application.root()), () => Weave.library.components.setDensity(key))(key);
Weave.application.chooseDensity = key => (Weave.application.applyDensity(key), Weave.application.change({ density: key }));

/* readings: a metric's last fortnight, which way it moved, and whether that way is the good one. */
Weave.application.sparkOf = (row, state) => Weave.application.readingsOver(row, Weave.application.sparkDays, state.tick);
Weave.application.movement = values => (Weave.library.composition.last(values) - Weave.library.composition.first(values)) / Weave.library.composition.first(values);
Weave.application.wayOf = change => Weave.library.control.either(() => change < 0, () => Weave.library.components.trendNames.down, () => Weave.library.components.trendNames.up)(change);
Weave.application.toneOf = (row, way) => Weave.library.control.either(() => way === row.good, () => Weave.library.components.toneNames.success, () => Weave.library.components.toneNames.danger)(way);
Weave.application.readingOf = (row, values) => ({ value: row.format(Weave.library.composition.last(values)), text: Weave.application.shift(Weave.application.movement(values)), direction: Weave.application.wayOf(Weave.application.movement(values)) });
Weave.application.metricTone = (row, values) => Weave.application.toneOf(row, Weave.application.wayOf(Weave.application.movement(values)));
Weave.application.metricSpec = (row, values, index) => Weave.library.composition.merge(Weave.application.readingOf(row, values), { tone: Weave.application.metricTone(row, values), values, series: Weave.library.components.seriesAt(index) });
Weave.application.metricCard = state => (row, index) => Weave.library.components.metric(Weave.library.composition.merge(row, Weave.application.metricSpec(row, Weave.application.sparkOf(row, state), index)));
Weave.application.metricCards = state => Weave.application.metrics.map(Weave.application.metricCard(state));

/* series charts: the lines still switched on, each in the slot its row was declared in, and the legend that switches them. */
Weave.application.spanOf = state => Weave.application.spans[state.span];
Weave.application.slotted = rows => rows.map((row, index) => Weave.library.composition.merge(row, { series: Weave.library.components.seriesAt(index) }));
Weave.application.linesOf = (rows, state, count) => Weave.application.slotted(rows).filter(row => Weave.application.shown(state, row)).map(row => Weave.library.composition.merge(row, { values: Weave.application.readingsOver(row, count, state.tick) }));
Weave.application.legendOf = (rows, state) => Weave.application.slotted(rows).map(row => Weave.library.composition.merge(row, { shown: Weave.application.shown(state, row), onAction: Weave.application.toggleSeries(row.key) }));
Weave.application.spanPicker = state => Weave.library.components.segmented({ active: state.span, items: Weave.library.composition.pairs(Weave.application.spans).map(([key, row]) => ({ key, label: row.label })), onPick: key => Weave.application.change({ span: key }) });
Weave.application.revenueLines = state => Weave.application.linesOf(Weave.application.streams, state, Weave.application.spanOf(state).count);
Weave.application.tallArea = (lines, label) => Weave.library.components.areaChart({ lines, label, plot: Weave.library.components.markNames.plot.tall });
Weave.application.revenuePlot = state => [Weave.application.spanPicker(state), Weave.application.tallArea(Weave.application.revenueLines(state), Weave.application.words.revenue), Weave.library.components.axis({ labels: Weave.application.spanOf(state).ticks })];
Weave.application.chartCard = chart => Weave.library.components.card({ tile: chart.tile, children: [Weave.library.components.chart(chart)] });
Weave.application.revenue = state => Weave.application.chartCard(Weave.library.composition.merge(Weave.application.charts.revenue, { legend: Weave.application.legendOf(Weave.application.streams, state), children: Weave.application.revenuePlot(state) }));

/* the rest of the overview: a funnel, the people on call, the plan mix, the deploy calendar and what just happened. */
Weave.application.counted = rows => rows.map(row => Weave.library.composition.merge(row, { reading: Weave.application.whole(row.value) }));
Weave.application.boxedHead = spec => [Weave.library.components.subtitle({ text: spec.title }), Weave.library.components.note({ text: spec.note })];
Weave.application.boxed = (spec, children) => Weave.library.components.card(Weave.library.composition.merge(spec, { children: Weave.application.boxedHead(spec).concat(children) }));
Weave.application.inSlot = slot => rows => rows.map(row => Weave.library.composition.merge(row, { series: slot }));
Weave.application.funnelRows = () => Weave.application.inSlot(Weave.library.components.seriesNames.three)(Weave.application.counted(Weave.application.data.funnel));
Weave.application.funnelCard = () => Weave.application.boxed(Weave.application.charts.funnel, [Weave.library.components.funnel({ items: Weave.application.funnelRows(), label: Weave.application.words.funnel })]);
Weave.application.teamCard = () => Weave.application.boxed(Weave.application.charts.team, [Weave.library.components.stack({ children: Weave.application.data.team.map(Weave.library.components.person) })]);
Weave.application.mixBar = () => Weave.library.components.stackBar({ items: Weave.application.slotted(Weave.application.data.plans), label: Weave.application.words.mix });
Weave.application.mixCard = () => Weave.application.boxed(Weave.application.charts.mix, [Weave.application.mixBar(), Weave.library.components.descriptions({ rows: Weave.application.data.accounts })]);
Weave.application.dayValue = index => Math.round(Weave.library.composition.noise(index) * 9 * Weave.library.control.either(() => index % 7 > 4, () => 0.25, () => 1)(index));
Weave.application.deployDays = () => Weave.library.composition.range(Weave.application.data.weeks * 7).map(index => ({ value: Weave.application.dayValue(index), reading: String(Weave.application.dayValue(index)) }));
Weave.application.deployKey = () => Weave.library.components.heatScale({ least: Weave.application.words.fewer, most: Weave.application.words.more });
Weave.application.deployCard = () => Weave.application.boxed(Weave.application.charts.deploys, [Weave.library.components.calendarHeat({ items: Weave.application.deployDays(), label: Weave.application.words.deploys }), Weave.application.deployKey()]);
Weave.application.activityCard = () => Weave.application.boxed(Weave.application.charts.activity, [Weave.library.components.timeline({ items: Weave.application.data.activity })]);

/* the greeting: the hero over the overview, on the midnight wash, with the quarter goal beside it. */
Weave.application.goalShare = state => Math.min(64 + state.tick * 0.7, 100);
Weave.application.goalTone = share => Weave.library.control.either(() => share >= 75, () => Weave.library.components.toneNames.success, () => Weave.library.components.toneNames.info)(share);
Weave.application.goalGauge = share => Weave.library.components.gauge({ value: share, reading: Weave.application.share(share / 100), label: Weave.application.words.goal, tone: Weave.application.goalTone(share) });
Weave.application.onTrack = () => Weave.library.components.statusPill({ text: Weave.application.words.onTrack, tone: Weave.application.tone.good });
Weave.application.centred = children => Weave.library.components.stack({ align: Weave.library.components.markNames.align.centre, children });
Weave.application.goal = state => Weave.application.centred([Weave.application.goalGauge(Weave.application.goalShare(state)), Weave.application.onTrack()]);
Weave.application.withAction = (button, run) => Weave.library.composition.merge(button, { onAction: run });
Weave.application.openPalette = () => Weave.application.palette();
Weave.application.greetingActions = () => [Weave.application.withAction(Weave.application.buttons.palette, Weave.application.openPalette), Weave.application.withAction(Weave.application.buttons.customers, Weave.application.go(Weave.application.viewNames.customers))];
Weave.application.greeting = state => Weave.library.components.hero(Weave.library.composition.merge(Weave.application.heroes.greeting, { actions: Weave.application.greetingActions(), aside: Weave.application.goal(state) }));
Weave.application.pausedAlert = () => Weave.library.components.alert({ tone: Weave.application.tone.warn, title: Weave.application.words.paused, note: Weave.application.words.pausedNote, action: Weave.application.withAction(Weave.application.buttons.resume, Weave.application.flipLive) });
Weave.application.pausedNote = state => Weave.library.control.either(() => state.live, Weave.library.composition.noop, Weave.application.pausedAlert)(state);
Weave.application.overviewCards = state => Weave.application.metricCards(state).concat([Weave.application.revenue(state), Weave.application.funnelCard(), Weave.application.teamCard(), Weave.application.mixCard(), Weave.application.deployCard(), Weave.application.activityCard()]);
Weave.application.overview = state => Weave.library.composition.compact([Weave.application.pausedNote(state), Weave.application.greeting(state), Weave.library.components.bento({ children: Weave.application.overviewCards(state) })]);

/* analytics: sessions by source, sign ups, the pages people read, where the money comes from, and how fast it was served. */
Weave.application.sessionLines = state => Weave.application.linesOf(Weave.application.sources, state, Weave.application.spans.month.count);
Weave.application.sessionPlot = state => [Weave.application.tallArea(Weave.application.sessionLines(state), Weave.application.words.sessions), Weave.library.components.axis({ labels: Weave.application.spans.month.ticks })];
Weave.application.sessions = state => Weave.application.chartCard(Weave.library.composition.merge(Weave.application.charts.sessions, { legend: Weave.application.legendOf(Weave.application.sources, state), children: Weave.application.sessionPlot(state) }));
Weave.application.signupRows = () => Weave.application.inSlot(Weave.library.components.seriesNames.two)(Weave.application.counted(Weave.application.data.signups));
Weave.application.signupCard = () => Weave.application.chartCard(Weave.library.composition.merge(Weave.application.charts.signups, { children: [Weave.library.components.barChart({ items: Weave.application.signupRows(), label: Weave.application.words.signups })] }));
Weave.application.pageRows = () => Weave.application.inSlot(Weave.library.components.seriesNames.one)(Weave.application.counted(Weave.application.data.pages));
Weave.application.pageCard = () => Weave.application.chartCard(Weave.library.composition.merge(Weave.application.charts.pages, { children: [Weave.library.components.rankBars({ items: Weave.application.pageRows(), label: Weave.application.words.pages })] }));
Weave.application.regionRows = () => Weave.application.slotted(Weave.application.data.regions).map(row => Weave.library.composition.merge(row, { key: row.label, reading: Weave.application.dollars(row.value) }));
Weave.application.regionTotal = () => Weave.application.dollars(Weave.library.components.chartSum(Weave.application.data.regions.map(row => row.value)));
Weave.application.regionRing = () => Weave.library.components.donut({ items: Weave.application.regionRows(), reading: Weave.application.regionTotal(), label: Weave.application.words.regionTotal });
Weave.application.regionCard = () => Weave.application.chartCard(Weave.library.composition.merge(Weave.application.charts.regions, { legend: Weave.application.regionRows(), children: [Weave.application.regionRing()] }));
Weave.application.latencyCell = (day, hour) => ({ value: 120 + 380 * Weave.library.composition.noise(day * 12 + hour) * Math.sin(hour / 3.8), reading: Weave.application.whole(120 + 380 * Weave.library.composition.noise(day * 12 + hour) * Math.sin(hour / 3.8)) });
Weave.application.latencyRows = () => Weave.application.data.days.map((label, day) => ({ label, cells: Weave.application.data.hours.map((hour, index) => Weave.application.latencyCell(day, index)) }));
Weave.application.latencyKey = () => Weave.library.components.heatScale({ least: Weave.application.words.quick, most: Weave.application.words.slow });
Weave.application.latencyCard = () => Weave.application.chartCard(Weave.library.composition.merge(Weave.application.charts.latency, { children: [Weave.library.components.heatmap({ items: Weave.application.latencyRows(), label: Weave.application.words.latency }), Weave.application.latencyKey()] }));
Weave.application.analytics = state => [Weave.library.components.bento({ children: [Weave.application.sessions(state), Weave.application.pageCard(), Weave.application.regionCard(), Weave.application.signupCard(), Weave.application.latencyCard()] })];

/* customers: a search and a health filter over the accounts, sorted by whichever column the reader pressed last. */
Weave.application.matchesQuery = (row, query) => (row.name + ' ' + row.company).toLowerCase().includes(query.toLowerCase());
Weave.application.matchesHealth = (row, health) => [Weave.application.healthNames.everyone, row.health].includes(health);
Weave.application.visible = state => Weave.library.composition.sortBy(Weave.application.sorts[state.sort])(Weave.application.people.filter(row => Weave.application.matchesQuery(row, state.query)).filter(row => Weave.application.matchesHealth(row, state.health)));
Weave.application.typed = event => Weave.application.change({ query: Weave.library.events.valueOfTarget(event) });
Weave.application.healthPicker = state => Weave.library.components.segmented({ active: state.health, items: Weave.library.composition.pairs(Weave.application.healths).map(([key, row]) => ({ key, label: row.label })), onPick: key => Weave.application.change({ health: key }) });
Weave.application.finder = state => Weave.library.components.searchBox({ name: 'customer', label: Weave.application.words.findCustomer, value: state.query, onEdit: Weave.application.typed });
Weave.application.headed = (state, key, label) => label + Weave.library.control.either(() => state.sort === key, () => Weave.application.words.sorted, () => '')(key);
Weave.application.sortedColumn = state => column => Weave.library.composition.merge(column, { label: Weave.application.headed(state, column.key, column.label), onAction: () => Weave.application.change({ sort: column.key }) });
Weave.application.maybeSorted = state => column => Weave.library.control.either(() => Weave.application.sortNames[column.key], Weave.application.sortedColumn(state), Weave.library.composition.identity)(column);
Weave.application.who = (value, row) => Weave.library.components.person({ name: row.name, note: row.company });
Weave.application.planTag = value => Weave.library.components.tag({ text: Weave.application.plans[value].label, tone: Weave.application.plans[value].tone });
Weave.application.healthPill = value => Weave.library.components.statusPill({ text: Weave.application.healths[value].label, tone: Weave.application.healths[value].tone });
Weave.application.seenHint = value => Weave.library.components.hint({ text: value });
Weave.application.nameColumn = { key: Weave.application.sortNames.name, label: Weave.application.words.customer, format: Weave.application.who };
Weave.application.planColumn = { key: 'plan', label: Weave.application.words.plan, format: Weave.application.planTag };
Weave.application.mrrColumn = { key: Weave.application.sortNames.mrr, label: Weave.application.words.mrrShort, format: Weave.application.money };
Weave.application.seatsColumn = { key: Weave.application.sortNames.seats, label: Weave.application.words.seats };
Weave.application.healthColumn = { key: 'health', label: Weave.application.words.health, format: Weave.application.healthPill };
Weave.application.seenColumn = { key: 'seen', label: Weave.application.words.seen, format: Weave.application.seenHint };
Weave.application.columnOrder = [Weave.application.nameColumn, Weave.application.planColumn, Weave.application.mrrColumn, Weave.application.seatsColumn, Weave.application.healthColumn, Weave.application.seenColumn];
Weave.application.columns = state => Weave.application.columnOrder.map(Weave.application.maybeSorted(state));
Weave.application.nobody = () => Weave.library.components.emptyState({ glyph: '🔭', title: Weave.application.words.nobody, note: Weave.application.words.nobodyNote });
Weave.application.ledger = state => Weave.library.control.either(rows => rows.length > 0, rows => Weave.library.components.table({ columns: Weave.application.columns(state), rows }), Weave.application.nobody)(Weave.application.visible(state));
Weave.application.tally = state => Weave.library.components.pill({ text: String(Weave.application.visible(state).length) + Weave.application.words.accounts });
Weave.application.customerTools = state => Weave.library.components.spread({ children: [Weave.library.components.row({ children: [Weave.application.finder(state), Weave.application.tally(state)] }), Weave.application.healthPicker(state)] });
Weave.application.customers = state => [Weave.library.components.panel({ children: [Weave.application.customerTools(state), Weave.application.ledger(state)] })];

/* the launch page: the public site, drawn with the same widgets as the desk and framed as a window inside it. */
Weave.application.siteActions = () => [Weave.application.buttons.trial, Weave.application.buttons.demo];
Weave.application.mixShot = () => Weave.library.components.card({ children: [Weave.library.components.subtitle({ text: Weave.application.words.mix }), Weave.application.mixBar()] });
Weave.application.siteShot = state => Weave.library.components.stack({ children: [Weave.application.metricCard(state)(Weave.library.composition.first(Weave.application.metrics), 0), Weave.application.mixShot()] });
Weave.application.siteHero = state => Weave.library.components.hero(Weave.library.composition.merge(Weave.application.heroes.site, { actions: Weave.application.siteActions(), aside: Weave.application.siteShot(state) }));
Weave.application.loose = children => Weave.library.components.stack({ gap: Weave.library.components.markNames.gap.loose, children });
Weave.application.block = (intro, children) => Weave.application.loose([Weave.library.components.sectionIntro(intro), Weave.library.components.panels({ children })]);
Weave.application.why = () => Weave.application.block(Weave.application.intros.why, Weave.application.data.features.map(Weave.library.components.feature));
Weave.application.priceCard = row => Weave.library.components.plan(Weave.library.composition.merge(row, { per: Weave.application.words.perSeat, action: { label: Weave.application.words.choose } }));
Weave.application.pricing = () => Weave.application.block(Weave.application.intros.pricing, Weave.application.data.prices.map(Weave.application.priceCard));
Weave.application.loved = () => Weave.application.block(Weave.application.intros.loved, Weave.application.data.quotes.map(Weave.library.components.testimonial));
Weave.application.callToAction = () => Weave.library.components.hero(Weave.library.composition.merge(Weave.application.heroes.cta, { actions: [Weave.application.buttons.trial] }));
Weave.application.logoBand = () => Weave.library.components.marquee({ label: Weave.application.words.trusted, items: Weave.application.data.logos });
Weave.application.divide = () => Weave.library.components.labelDivider({ text: Weave.application.words.orWord });
Weave.application.siteParts = state => [Weave.application.siteHero(state), Weave.application.logoBand(), Weave.application.why(), Weave.application.divide(), Weave.application.pricing(), Weave.application.loved(), Weave.application.callToAction()];
Weave.application.launch = state => [Weave.library.components.windowFrame({ title: Weave.application.words.site, label: Weave.application.words.site, children: [Weave.application.loose(Weave.application.siteParts(state))] })];

/* settings: the appearance rows, the live desk switches and the workspace name. Every control writes the store and nothing else. */
Weave.application.picker = (table, active, pick) => Weave.library.components.segmented({ active, items: Weave.library.composition.pairs(table).map(([key, label]) => ({ key, label })), onPick: pick });
Weave.application.choiceRow = (label, picker) => Weave.library.components.stack({ gap: Weave.library.components.markNames.gap.tight, children: [Weave.library.components.fieldLabel({ label }), picker] });
Weave.application.themeRow = state => Weave.application.choiceRow(Weave.application.words.themeWord, Weave.application.picker(Weave.application.themeChoices, state.theme, Weave.application.chooseTheme));
Weave.application.paletteRow = state => Weave.application.choiceRow(Weave.application.words.paletteWord, Weave.application.picker(Weave.application.paletteChoices, state.palette, Weave.application.choosePalette));
Weave.application.densityRow = state => Weave.application.choiceRow(Weave.application.words.densityWord, Weave.application.picker(Weave.application.densityChoices, state.density, Weave.application.chooseDensity));
Weave.application.appearance = state => Weave.application.boxed(Weave.application.charts.appearance, [Weave.application.themeRow(state), Weave.application.paletteRow(state), Weave.application.densityRow(state)]);
Weave.application.streamSwitch = state => Weave.library.components.switchField({ label: Weave.application.words.streamLabel, checked: state.live, onChoose: Weave.application.flipLive });
Weave.application.digestSwitch = state => Weave.library.components.switchField({ label: Weave.application.words.digestLabel, checked: state.digest, onChoose: () => Weave.application.change({ digest: !state.digest }) });
Weave.application.liveDesk = state => Weave.application.boxed(Weave.application.charts.liveDesk, [Weave.application.streamSwitch(state), Weave.application.digestSwitch(state)]);
Weave.application.drafted = name => event => Weave.application.store.update(state => ({ draft: Weave.library.composition.merge(state.draft, { [name]: Weave.library.events.valueOfTarget(event) }) }));
Weave.application.draftField = (state, row) => Weave.library.composition.merge(row, { value: state.draft[row.name], onEdit: Weave.application.drafted(row.name) });
Weave.application.save = () => (Weave.application.store.update(state => ({ saved: state.draft })), Weave.application.toasts.push(Weave.application.words.saved, Weave.library.components.toneNames.success));
Weave.application.saveButton = () => Weave.library.components.actions({ children: [Weave.library.components.actionButton(Weave.application.withAction(Weave.application.buttons.save, Weave.application.save))] });
Weave.application.workspaceFields = state => [Weave.library.components.field(Weave.application.draftField(state, Weave.application.fields.name)), Weave.library.components.inputGroup(Weave.application.draftField(state, Weave.application.fields.address))];
Weave.application.workspaceForm = state => Weave.application.boxed(Weave.application.charts.workspace, Weave.application.workspaceFields(state).concat([Weave.application.saveButton()]));
Weave.application.settingsMain = state => Weave.library.components.column({ span: Weave.library.components.markNames.span.twoThirds, children: [Weave.application.appearance(state), Weave.application.workspaceForm(state)] });
Weave.application.settingsSide = state => Weave.library.components.column({ span: Weave.library.components.markNames.span.third, children: [Weave.application.liveDesk(state)] });
Weave.application.settings = state => [Weave.library.components.columns({ children: [Weave.application.settingsMain(state), Weave.application.settingsSide(state)] })];

/* the rail and the bar: where the reader can go, and what they can do from anywhere. */
Weave.application.atRisk = () => Weave.application.people.filter(row => row.health === Weave.application.healthNames.risk).length;
Weave.application.countFor = key => Weave.library.control.either(() => key === Weave.application.viewNames.customers, Weave.application.atRisk, Weave.library.composition.noop)(key);
Weave.application.railItem = key => Weave.library.composition.merge(Weave.application.views[key], { key, onAction: Weave.application.go(key), count: Weave.application.countFor(key) });
Weave.application.railGroup = group => ({ label: group.label, items: group.keys.map(Weave.application.railItem) });
Weave.application.railFoot = () => [Weave.library.components.person(Weave.application.owner), Weave.library.components.statusPill({ text: Weave.application.words.systems, tone: Weave.application.tone.good })];
Weave.application.rail = state => Weave.library.components.sideNav({ title: state.saved[Weave.application.fields.name.name], glyph: Weave.application.words.planet, active: state.view, groups: Weave.application.railGroups.map(Weave.application.railGroup), footer: Weave.application.railFoot() });
Weave.application.pulse = state => Weave.library.components.statusPill(Weave.library.control.either(() => state.live, () => Weave.application.pulseOn, () => Weave.application.pulseOff)(state));
Weave.application.bellLabel = state => Weave.application.words.bellLabel + ', ' + String(state.unread) + Weave.application.words.unread;
Weave.application.finderButton = () => Weave.library.components.searchTrigger({ label: Weave.application.words.search, keys: Weave.application.data.paletteKeys, onAction: Weave.application.openPalette });
Weave.application.bellButton = state => Weave.library.components.iconButton({ glyph: Weave.application.words.bell, label: Weave.application.bellLabel(state), onAction: Weave.application.bell });
Weave.application.themeButton = () => Weave.library.components.iconButton({ glyph: Weave.application.words.halfMoon, label: Weave.application.words.themeLabel, onAction: Weave.application.flipTheme });
Weave.application.barActions = state => [Weave.application.finderButton(), Weave.application.pulse(state), Weave.application.bellButton(state), Weave.application.themeButton()];
Weave.application.bar = state => Weave.library.components.topBar({ title: Weave.application.views[state.view].label, note: Weave.application.views[state.view].note, actions: Weave.application.barActions(state) });

/* overlays: the palette, the notification drawer and the key map that reaches them. */
Weave.application.command = (label, run, close) => ({ label, onAction: () => (close(), run()) });
Weave.application.viewCommands = close => Weave.application.viewKeysInOrder().map(key => Weave.application.command(Weave.application.words.goPrefix + Weave.application.views[key].label, Weave.application.go(key), close));
Weave.application.actionRows = () => [[Weave.application.words.flipTheme, Weave.application.flipTheme], [Weave.application.words.flipLive, Weave.application.flipLive], [Weave.application.words.openBell, Weave.application.bell]];
Weave.application.moreCommands = close => Weave.application.actionRows().map(([label, run]) => Weave.application.command(label, run, close));
Weave.application.commands = close => Weave.application.viewCommands(close).concat(Weave.application.moreCommands(close));
Weave.application.palette = () => Weave.library.patterns.dialog({ title: Weave.application.words.paletteTitle, body: close => [Weave.library.patterns.commandPalette({ commands: Weave.application.commands(close) }).element] });
Weave.application.bellBody = () => [Weave.library.components.listGroup({ items: Weave.application.data.alerts }), Weave.library.components.note({ text: Weave.application.words.caughtUp })];
Weave.application.bell = () => (Weave.library.patterns.drawer({ title: Weave.application.words.bellLabel, body: Weave.application.bellBody() }), Weave.application.change({ unread: 0 }));
Weave.application.viewKeysInOrder = () => Weave.library.composition.keys(Weave.application.views);
Weave.application.numberKeys = () => Weave.library.composition.fromPairs(Weave.application.viewKeysInOrder().map((key, index) => [String(index + 1), Weave.application.go(key)]));
Weave.application.keyMap = () => Weave.library.composition.merge(Weave.application.numberKeys(), { 'ctrl+k': Weave.application.palette, t: Weave.application.flipTheme, l: Weave.application.flipLive });

/* the desk: one render for the whole application, the view it draws looked up from a table and never chosen by a branch. */
Weave.application.bodies = {};
Weave.application.bodies.overview = Weave.application.overview;
Weave.application.bodies.analytics = Weave.application.analytics;
Weave.application.bodies.customers = Weave.application.customers;
Weave.application.bodies.launch = Weave.application.launch;
Weave.application.bodies.settings = Weave.application.settings;
Weave.application.render = state => Weave.library.components.workspace({ nav: Weave.application.rail(state), children: [Weave.application.bar(state), Weave.library.components.page({ data: { key: state.view }, children: Weave.application.bodies[state.view](state) })] });
Weave.application.desk = () => Weave.library.patterns.connect(Weave.application.store)(Weave.application.render).element;
Weave.application.mountDesk = () => Weave.library.elements.append([Weave.application.desk()])(Weave.library.browser.body());
Weave.application.start = () => (Weave.library.components.installStyles(), Weave.application.mountDesk(), Weave.library.patterns.shortcuts(Weave.application.keyMap()), Weave.library.timing.every(Weave.application.pace, Weave.application.tick));
Weave.library.events.ready(Weave.application.start);
</script>
</body>
</html>
