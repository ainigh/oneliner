<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weave demos</title>
</head>
<body>
<script src="../dist/weave.js"></script>
<script>
/* application: the gallery. One row per demo, and the gallery itself is built from the same tiles. */
Weave.application = {};
Weave.application.demos = [{ glyph: '📥', label: 'Relay — a team inbox', href: '../apps/relay.html', note: 'The first flagship: three panes over twelve hundred threads, keyboard driven.' }, { glyph: '🍽️', label: 'Pantry — ordering from a kitchen', href: '../apps/pantry.html', note: 'The second flagship: thumb first, a basket that changes shape with the screen.' }, { glyph: '🎨', label: 'Style guide', href: '../styleguide.html', note: 'Every table the stylesheet is generated from, drawn from that table.' }, { glyph: '📈', label: 'Sales desk', href: 'crm.html', note: 'Dashboard, data grid and master detail over a pipeline.' }, { glyph: '🗂️', label: 'Engineering board', href: 'board.html', note: 'A kanban board driven by a command palette.' }, { glyph: '🎫', label: 'Help desk', href: 'helpdesk.html', note: 'A ticket queue whose detail pane is a live chat.' }, { glyph: '📦', label: 'Warehouse', href: 'warehouse.html', note: 'Sorting and paging over stock, plus a booking wizard.' }, { glyph: '🎓', label: 'Course planner', href: 'school.html', note: 'A curriculum tree beside its reading, and a todo list.' }, { glyph: '🩺', label: 'Clinic front desk', href: 'clinic.html', note: 'A day schedule and a three step intake form.' }, { glyph: '🗓️', label: 'Conference programme', href: 'agenda.html', note: 'A month calendar of sessions, priced and counted down.' }];
Weave.application.link = demo => Weave.library.components.anchor({ text: demo.label, attributes: { [Weave.library.browser.keywords.href]: demo.href } });
Weave.application.mark = demo => Weave.library.components.glyphMark({ text: demo.glyph });
Weave.application.tile = demo => Weave.library.components.card({ children: [Weave.application.mark(demo), Weave.application.link(demo), Weave.library.components.note({ text: demo.note })] });
Weave.application.gallery = () => Weave.library.components.tiles({ children: Weave.application.demos.map(Weave.application.tile) });
Weave.application.themeToggle = () => Weave.library.components.button({ text: 'Theme', onAction: Weave.library.components.toggleTheme });
Weave.application.heading = () => Weave.library.components.pageHeader({ children: [Weave.library.components.title({ text: 'Weave demos' }), Weave.application.themeToggle()] });
Weave.application.page = () => Weave.library.components.page({ children: [Weave.application.heading(), Weave.library.components.note({ text: 'The first three are the flagship applications and the live style guide. The rest are seven demos, one per domain.' }), Weave.application.gallery()] });
Weave.application.start = () => (Weave.library.components.installStyles(), Weave.library.elements.append([Weave.application.page()])(Weave.library.browser.body()));
Weave.library.events.ready(Weave.application.start);
</script>
</body>
</html>
