<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weave demos</title>
</head>
<body>
<script src="../dist/weave.js"></script>
<script src="kit.js"></script>
<script>
/* application: the gallery. One row per demo, and the gallery itself is built from the same tiles. */
Weave.application = {};
Weave.application.demos = [{ glyph: '🪐', label: 'Orbit — a product command centre', href: 'orbit.html', note: 'The showcase: a live desk of metrics, area charts, a gauge and a funnel, a customer ledger, a launch page framed inside the product, and a palette for all of it.' }, { glyph: '📥', label: 'Relay — a team inbox', href: '../apps/relay.html', note: 'The first flagship: three panes over twelve hundred threads, keyboard driven.' }, { glyph: '🍽️', label: 'Pantry — ordering from a kitchen', href: '../apps/pantry.html', note: 'The second flagship: thumb first, a basket that changes shape with the screen.' }, { glyph: '🧱', label: 'Every element', href: 'elements.html', note: 'One card per widget the library offers, with the call that draws it.' }, { glyph: '⚙️', label: 'Every pattern', href: 'patterns.html', note: 'Every stateful piece, running, beside the line that starts it.' }, { glyph: '🎚️', label: 'Make it yours', href: 'tailor.html', note: 'Theme, density, palette and modifiers, wired to the page you are reading.' }, { glyph: '🧰', label: 'The kit', href: 'kit.html', note: 'Every piece the demos share, drawn from the table that documents it.' }, { glyph: '🎨', label: 'Style guide', href: '../styleguide.html', note: 'Every table the stylesheet is generated from, drawn from that table.' }, { glyph: '📈', label: 'Sales desk', href: 'crm.html', note: 'Dashboard, data grid and master detail over a pipeline.' }, { glyph: '🏢', label: 'Tenants', href: 'tenants.html', note: 'A console one company runs for four customers, each with its own plan and people.' }, { glyph: '🗂️', label: 'Engineering board', href: 'board.html', note: 'A kanban board driven by a command palette.' }, { glyph: '🎫', label: 'Help desk', href: 'helpdesk.html', note: 'A ticket queue whose detail pane is a live chat.' }, { glyph: '📦', label: 'Warehouse', href: 'warehouse.html', note: 'Sorting and paging over stock, plus a booking wizard.' }, { glyph: '🎓', label: 'Course planner', href: 'school.html', note: 'A curriculum tree beside its reading, and a todo list.' }, { glyph: '🩺', label: 'Clinic front desk', href: 'clinic.html', note: 'A day schedule and a three step intake form.' }, { glyph: '🗓️', label: 'Conference programme', href: 'agenda.html', note: 'A month calendar of sessions, priced and counted down.' }, { glyph: '🔐', label: 'Accounts', href: 'account.html', note: 'The gate, the session behind it, and the desk it lets you at.' }, { glyph: '🏦', label: 'Kestrel Bank', href: 'bank.html', note: 'Accounts, a transfer that asks first, and a statement.' }, { glyph: '🧺', label: 'Greengrocer', href: 'shop.html', note: 'A storefront: offers, filters as chips, and a basket over the page.' }, { glyph: '🪄', label: 'Loom — a marketing page', href: 'landing.html', note: 'The shape every product site takes: a hero, three reasons, prices, quotes and questions.' }, { glyph: '📊', label: 'Signal — service analytics', href: 'signal.html', note: 'Every chart the library draws: lines you can switch off, bars, ranks, a ring and a heatmap.' }, { glyph: '🚆', label: 'Kestrel Rail', href: 'travel.html', note: 'A booking from end to end, on one store, with the summary always in step.' }, { glyph: '📖', label: 'Handbook — a written site', href: 'handbook.html', note: 'Prose in a measured column: a contents that marks where you are, callouts, numbered listings and a pager.' }, { glyph: '🔍', label: 'Forge — a code review', href: 'review.html', note: 'Four changed files, a coloured diff, the conversation hanging off it, and somewhere to drop a screenshot.' }];
Weave.application.link = demo => Weave.library.components.anchor({ text: demo.label, attributes: { [Weave.library.browser.keywords.href]: demo.href } });
Weave.application.mark = demo => Weave.library.components.glyphMark({ text: demo.glyph });
Weave.application.tile = demo => Weave.library.components.card({ children: [Weave.application.mark(demo), Weave.application.link(demo), Weave.library.components.note({ text: demo.note })] });
Weave.application.gallery = () => Weave.library.components.tiles({ children: Weave.application.demos.map(Weave.application.tile) });
Weave.application.title = 'Weave demos';
Weave.application.blurb = 'Orbit comes first: every showcase widget in one live product. Then the two flagship applications. Then the reference pages — every element, every pattern, the styling system and the kit — and then a demo per domain.';
Weave.application.page = () => Weave.kit.shell({ title: Weave.application.title, note: Weave.application.blurb, children: [Weave.application.gallery()] });
Weave.application.start = () => (Weave.library.components.installStyles(), Weave.library.elements.append([Weave.application.page()])(Weave.library.browser.body()));
Weave.library.events.ready(Weave.application.start);
</script>
</body>
</html>
