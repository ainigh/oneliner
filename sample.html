<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weave sample - the right coding style</title>
<style>body { margin: 0; font: 14px system-ui, sans-serif; } button { position: absolute; }</style>
</head>
<body>
<script src="dist/weave.js"></script>
<script>
/* application: uses only Weave.library.*, never the browser directly, in the same oneliner style. */
Weave.application = {};
Weave.application.count = 0;
Weave.application.buttonClass = 'spawned';
Weave.application.buttonSelector = '.spawned';
Weave.application.randomCoordinate = extent => Weave.library.composition.random(extent);
Weave.application.randomLeft = () => Weave.application.randomCoordinate(Weave.library.style.viewport().width - 120);
Weave.application.randomTop = () => Weave.application.randomCoordinate(Weave.library.style.viewport().height - 40);
Weave.application.randomPosition = () => ({ left: Weave.application.randomLeft(), top: Weave.application.randomTop() });
Weave.application.nextLabel = () => 'Click me #' + Weave.application.increment();
Weave.application.increment = () => Weave.application.count = Weave.application.count + 1;
Weave.application.buttonSpec = () => ({ classes: [Weave.application.buttonClass], text: Weave.application.nextLabel(), styles: Weave.application.randomPosition() });
Weave.application.makeButton = () => Weave.library.elements.button(Weave.application.buttonSpec());
Weave.application.spawnButton = () => Weave.library.elements.appendTo(Weave.library.browser.body())(Weave.application.makeButton());
Weave.application.moveButton = button => Weave.library.style.setCssAll(Weave.application.randomPosition())(button);
Weave.application.onClick = (event, button) => (Weave.application.moveButton(button), Weave.application.spawnButton());
Weave.application.bindDelegate = () => Weave.library.events.delegate(Weave.library.events.types.click, Weave.application.buttonSelector, Weave.application.onClick)(Weave.library.browser.body());
Weave.application.highlightAll = () => Weave.library.collections.attributes.addClass('seen')(Weave.library.query.all(Weave.application.buttonSelector));
Weave.application.start = () => (Weave.application.bindDelegate(), Weave.application.spawnButton(), Weave.application.highlightAll());
Weave.library.events.ready(Weave.application.start);
</script>
</body>
</html>
